name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"
          node --input-type=module --eval '
            import metadata from "./package.json" with { type: "json" };
            const expectedTag = `v${metadata.version}`;
            if (process.env.RELEASE_TAG !== expectedTag) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match ${expectedTag}`);
            }
          '

      - name: Install supported npm CLI
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm run package:check

      - name: Publish
        run: npm publish --ignore-scripts --access public
